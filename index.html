<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Happy Birthday, Hifza</title>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,600;1,400&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="bunt" id="bunt" aria-hidden="true"></div>
  <div id="bls" aria-hidden="true"></div>

  <main>
    <h1 id="t">Happy 15th, Hifza! 🎈</h1>

    <div class="cake" id="cake">
      <div class="candles" id="cs"></div>
      <div class="l l1"></div>
      <div class="l l2"></div>
      <div class="l l3"></div>
      <div class="plate"></div>
    </div>

    <div id="ctl">
      <button class="btn" onclick="blow()">Tap to blow 💨</button>
    </div>

    <div class="done" id="done">
      <button class="gift" id="gb" onclick="openGift()" aria-label="Open your gift">🎁</button>
      <div id="gn" style="display:flex;flex-direction:column;align-items:center;gap:12px"></div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
